services:
  api:
    build: .
    image: fashion-app:latest # Built once here, then reused by celery_worker
    command: >
      gunicorn src.main:app
      --workers 3
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      - redis
    restart: always

  celery_worker:
    # Same code as the api, so reuse its image instead of building a second copy
    image: fashion-app:latest
    pull_policy: never
    command: celery -A src.core.celery_app:celery_app worker --loglevel=info -Q queue_image --concurrency=1
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  # Reverse proxy in front of the api. Caddy gets and renews the
  # HTTPS certificate for the domains in the Caddyfile automatically
  caddy:
    image: caddy:2.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # Keeps the certificates between restarts
      - caddy_config:/config
    depends_on:
      - api
    restart: always

volumes:
  caddy_data:
  caddy_config:
