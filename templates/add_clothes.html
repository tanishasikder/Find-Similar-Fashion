<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Clothing</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: rgb(0, 213, 255);
      margin: 0;
      padding: 2rem 1rem;
    }
    .card {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
    }
    h1 { margin-top: 0; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.3rem; box-sizing: border-box; }
    small { color: #666; }
    button {
      margin-top: 1.5rem;
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 6px;
      background: rgb(0, 150, 200);
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Add Clothing</h1>
    <a href="/clothes">Back to saved clothes</a>

    <!-- Field names match the Form(...) parameters of POST /add in db_router.py -->
    <form action="/add" method="post" enctype="multipart/form-data">
      <label for="color">Color</label>
      <input id="color" name="color" required>

      <label for="category">Category</label>
      <input id="category" name="category" required>

      <label>Attributes</label>
      <small>Leave extra boxes empty if you don't need them</small>
      <input name="attributes">
      <input name="attributes">
      <input name="attributes">

      <label for="image">Image (optional)</label>
      <input id="image" name="image" type="file" accept="image/*">

      <button type="submit">Save</button>
    </form>
  </div>
</body>
</html>
